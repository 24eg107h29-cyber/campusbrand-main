spring.application.name=campusbrand-backend
server.port=${PORT:8081}

# Frontend CORS URL(s) - Supports comma-separated list of origins for local dev and production domains
app.frontend-url=${FRONTEND_URL:http://localhost:5174,http://localhost:5173,http://127.0.0.1:5174,http://127.0.0.1:5173}

# Datasource configuration: defaults to persistent file-based H2 database for out-of-the-box local development.
# Set DB_URL, DB_USERNAME, DB_PASSWORD environment variables to point to MySQL (or PostgreSQL) when desired.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/campusbranddb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# HikariCP Connection Pool Optimization for concurrency and low latency
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:15}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# H2 Console - Disabled by default in production for security; enable via H2_CONSOLE_ENABLED=true for local debug
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Session and Cookie Security
server.servlet.session.cookie.name=CAMPUSBRAND_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${COOKIE_SAMESITE:lax}
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=7d

# Initial Admin Configuration (override in production via environment variables)
app.admin.email=${ADMIN_EMAIL:admin@campusbrand.edu}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.admin.name=${ADMIN_NAME:Campus Admin}

# Rate Limiting Configuration
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.login-per-minute=${RATE_LIMIT_LOGIN:30}

app.upload.dir=${UPLOAD_DIR:uploads}

# Multipart upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
