spring.application.name=campusbrand-backend
server.port=8081

app.frontend-url=${FRONTEND_URL:http://localhost:5174}

# Datasource configuration: defaults to persistent file-based H2 database for out-of-the-box local development.
# Set DB_URL, DB_USERNAME, DB_PASSWORD environment variables to point to MySQL when desired.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/campusbranddb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.upload.dir=${UPLOAD_DIR:uploads}

# Multipart upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

